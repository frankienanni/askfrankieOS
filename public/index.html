<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AskFrankie OS</title><link rel="stylesheet" href="style.css"><body><main><header><div><small>ASKFRANKIE / PRIVATE OPERATIONS</small><h1>Business Control Center</h1><p>Plan, produce, review and measure. No automatic external actions.</p></div><button id="logout" hidden>Sign out</button></header><section id="login"><h2>Founder sign-in</h2><form id="loginform"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button>Sign in</button></form></section><p id="message" role="status"></p><div id="app" hidden><div class="bar"><label>Client filter<input id="filter" placeholder="All clients"></label><button id="refresh">Refresh</button></div><div class="kpis" id="kpis"></div><p id="limits"></p><section><h2>AI work queue</h2><form id="jobform"><label>Client<input name="client" value="AskFrankie" required maxlength="100"></label><label>Agent<select name="role"><option>operations</option><option>marketing</option><option>creative</option><option>social</option><option>sales</option><option>developer</option><option>finance</option><option>analytics</option><option>quality</option></select></label><label class="wide">Brief — no secrets or personal data<textarea name="brief" required maxlength="8000" rows="4"></textarea></label><button>Create task</button></form><div id="jobs"></div></section><section><h2>Cash & founder time</h2><form id="ledgerform"><label>Client<input name="client" value="AskFrankie" required></label><label>Date<input name="day" type="date" required></label><label>Cash received (€)<input name="revenue" type="number" min="0" step=".01" required></label><label>Cash costs (€)<input name="cost" type="number" min="0" step=".01" required></label><label>Founder hours<input name="hours" type="number" min="0" step=".01" required></label><label>Note<input name="note"></label><button>Record</button></form><div id="ledger"></div></section><section><h2>Acquisition measurements</h2><form id="metricform"><label>Client<input name="client" value="AskFrankie" required></label><label>Period start<input name="day" type="date" required></label><label>Channel<input name="channel" required placeholder="Instagram, weekly"></label><label>Visits<input name="visits" type="number" min="0"></label><label>Qualified leads<input name="leads" type="number" min="0"></label><label>Attended calls<input name="calls" type="number" min="0"></label><label>Sales<input name="sales" type="number" min="0"></label><label>Note / period / source<input name="note"></label><button>Record measurement</button></form><div id="metrics"></div></section></div></main><script type="module" src="app.js"></script></body></html>
